*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{display:grid;place-items:center;min-height:100vh;min-height:100dvh;padding:24px 16px;color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

h1{font-size:20px;font-weight:650;margin:0 0 4px;overflow-wrap:anywhere}
p{margin:0;color:var(--muted)}
form{margin-top:18px;display:grid;gap:10px}
input{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
input[aria-invalid="true"]{border-color:var(--bad)}
button{font:inherit;font-weight:650;border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#fff;cursor:pointer}
@media (prefers-color-scheme:dark){button{color:#0c1220}}
button:disabled{opacity:.6;cursor:default}
.err{color:var(--bad);background:var(--bad-bg);border-radius:9px;padding:7px 11px;font-size:14px}
.err[hidden]{display:none}
.note{font-size:13px;margin-top:14px}
</style>
