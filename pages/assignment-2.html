<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d2127;--muted:#5f6b7a;--line:#e3e6eb;--accent:#2f6fed;--accent-bg:#e8f0fe;--bad:#c62f4f;--bad-bg:#fdecf0}
@media (prefers-color-scheme:dark){:root{--bg:#111418;--card:#181c21;--text:#e8ebef;--muted:#9aa4b1;--line:#2a3038;--accent:#7aa7ff;--accent-bg:#1e2a40;--bad:#ff7d9d;--bad-bg:#2e1921}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{display:grid;place-items:center;min-height:100vh;min-height:100dvh;padding:24px 16px;color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 26px 24px;box-shadow:0 1px 2px rgba(20,25,35,.05),0 10px 30px rgba(20,25,35,.07)}
main[hidden]{display:none}
.lock{width:44px;height:44px;border-radius:12px;background:var(--accent-bg);color:var(--accent);display:grid;place-items:center;margin-bottom:14px}
h1{font-size:20px;font-weight:650;margin:0 0 4px;overflow-wrap:anywhere}
p{margin:0;color:var(--muted)}
form{margin-top:18px;display:grid;gap:10px}
input{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
input[aria-invalid="true"]{border-color:var(--bad)}
button{font:inherit;font-weight:650;border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#fff;cursor:pointer}
@media (prefers-color-scheme:dark){button{color:#0c1220}}
button:disabled{opacity:.6;cursor:default}
.err{color:var(--bad);background:var(--bad-bg);border-radius:9px;padding:7px 11px;font-size:14px}
.err[hidden]{display:none}
.details{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);color:var(--text);font-size:14px}
.details a{color:var(--accent);font-weight:600;text-decoration:none}
.details a:hover{text-decoration:underline}
.note{font-size:13px;margin-top:8px}
</style>

  function hex(h) { var b = new Uint8Array(h.length / 2); for (var i = 0; i < b.length; i++) b[i] = parseInt(h.substr(i * 2, 2), 16); return b; }
  function toHex(b) { var s = ""; for (var i = 0; i < b.length; i++) s += (b[i] < 16 ? "0" : "") + b[i].toString(16); return s; }
  function b64(s) { var t = atob(s.replace(/\s+/g, "")), b = new Uint8Array(t.length); for (var i = 0; i < t.length; i++) b[i] = t.charCodeAt(i); return b; }
  function load() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function save(v) { try { if (v) localStorage.setItem(KEY, v); else localStorage.removeItem(KEY); } catch (e) {} }
  function derive(pw) {
    return S.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]).then(function (base) {
      return S.deriveBits({name: "PBKDF2", salt: hex(C.salt), iterations: C.iter, hash: "SHA-256"}, base, 512);
    }).then(function (bits) { return new Uint8Array(bits); });
  }
  // Resolves true and shows the page if the key fits, false if it does not.
  function unlock(raw, remember) {
    var iv = hex(C.iv), ct = b64($("sp-data").textContent), msg = new Uint8Array(iv.length + ct.length);
    msg.set(iv); msg.set(ct, iv.length);
    return S.importKey("raw", raw.slice(32, 64), {name: "HMAC", hash: "SHA-256"}, false, ["verify"]).then(function (mk) {
      return S.verify("HMAC", mk, hex(C.mac), msg);
    }).then(function (ok) {
      if (!ok || done) return false;
      return S.importKey("raw", raw.slice(0, 32), {name: "AES-CBC"}, false, ["decrypt"]).then(function (ek) {
        return S.decrypt({name: "AES-CBC", iv: iv}, ek, ct);
      }).then(function (pt) { return ready.then(function () { return pt; }); }).then(function (pt) {
        if (done) return true;
        done = true;
        if (remember) save(toHex(raw));
        var page = new TextDecoder().decode(pt);
        document.open(); document.write(page); document.close();
        // Inside the site's tab bar: let it see the new page, so links to other tabs keep working.
        try { if (window.frameElement) window.frameElement.dispatchEvent(new Event("load")); } catch (e) {}
        return true;
      });
    });
  }
  function ask() {
    var gate = $("gate"), pw = $("pw"), err = $("err"), go = $("go");
    gate.hidden = false; pw.focus();
    $("form").addEventListener("submit", function (e) {
      e.preventDefault();
      if (!pw.value) return;
      go.disabled = true; go.textContent = "Unlocking…"; err.hidden = true; pw.removeAttribute("aria-invalid");
      derive(pw.value).then(function (raw) { return unlock(raw, true); }).then(function (ok) {
        if (ok) return;
        go.disabled = false; go.textContent = "Unlock"; err.hidden = false; pw.setAttribute("aria-invalid", "true"); pw.select();
      }).catch(function () { go.disabled = false; go.textContent = "Unlock"; err.hidden = false; err.textContent = "This browser could not unlock the page."; });
    });
  }
  if (!S) {
    $("gate").hidden = false;
    $("form").hidden = true;
    $("err").hidden = false;
    $("err").textContent = location.protocol === "https:" ? "This browser is too old to open this site." : "Open this site through its https:// address.";
    return;
  }
  // Unlocked in another tab or page of this site: open here too.
  window.addEventListener("storage", function (e) { if (e.key === KEY && e.newValue && !done) unlock(hex(e.newValue), false); });
  var saved = load();
  if (saved && /^[0-9a-f]{128}$/.test(saved)) {
    unlock(hex(saved), false).then(function (ok) { if (!ok) { save(null); ask(); } }, function () { save(null); ask(); });
  } else {
    ask();
  }
})();
</script>
